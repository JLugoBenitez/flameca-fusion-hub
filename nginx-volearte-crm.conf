# Configuración de Nginx para /crm
# Copiar este contenido a /etc/nginx/sites-available/volearte
# O agregar esta sección location dentro del server block existente

# Si quieres agregarlo al archivo existente, añade esta sección location:
location /crm {
    alias /var/www/Volearte/crm/dist;
    index index.html;
    try_files $uri $uri/ /crm/index.html;
    
    # Cache para archivos estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Desactivar logs de favicon
    location = /crm/favicon.ico {
        log_not_found off;
        access_log off;
    }
}

