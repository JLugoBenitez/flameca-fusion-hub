server {
    server_name volearteflamenca.es www.volearteflamenca.es;

    root /var/www/Volearte/dist;
    index index.html;

    # Configuración para /crm (DEBE ESTAR DENTRO del server block)
    location /crm {
        alias /var/www/Volearte/crm/dist;
        index index.html;
        try_files $uri $uri/ /crm/index.html;

        # Cache para archivos estáticos
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Desactivar logs de favicon
        location = /crm/favicon.ico {
            log_not_found off;
            access_log off;
        }
    }

    # Configuración para SPA (Single Page Application) - raíz
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache para archivos estáticos (raíz)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Desactivar logs de favicon
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/volearteflamenca.es/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/volearteflamenca.es/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.volearteflamenca.es) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = volearteflamenca.es) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name volearteflamenca.es www.volearteflamenca.es;
    return 404; # managed by Certbot
}



